# Actualiza los precios en pesos según el dólar Banco Nación y redeploya.
#
# Corre todos los días a las 9:00 (hora Argentina). El build ya ejecuta
# scripts/actualizar-precios.mjs (hook "prebuild"), así que acá solo
# hace falta buildear, commitear el cambio de precios si lo hubo, y
# publicar.
#
# Setup necesario (una sola vez, en Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  → token con permiso "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID → ID de la cuenta de Cloudflare
#
# Se puede disparar a mano desde la pestaña Actions (workflow_dispatch).

name: Precios diarios (dólar BNA)

on:
  schedule:
    # 12:00 UTC = 9:00 Argentina (UTC-3).
    - cron: '0 12 * * *'
  workflow_dispatch:

# Necesario para que el bot pueda commitear los precios actualizados.
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Red de seguridad: mientras el modo prueba esté puesto, el checkout
      # cobra $1 en vez del precio real. Si estuviera activo, un deploy
      # automático lo dejaría vivo en producción sin que nadie lo note.
      # Preferimos que el workflow falle y avise por mail.
      - name: Verificar que no esté el modo prueba de $1
        run: |
          if grep -q 'PRECIO_PRUEBA_ARS' wrangler.jsonc; then
            echo "::error::PRECIO_PRUEBA_ARS sigue en wrangler.jsonc — el checkout cobra \$1."
            echo "::error::Sacá esa var de wrangler.jsonc antes de dejar correr el deploy automático."
            exit 1
          fi
          echo "OK: sin modo prueba, el checkout cobra los precios reales."

      # El hook "prebuild" actualiza los .md antes de compilar.
      - name: Build (actualiza precios y compila)
        run: npm run build

      # Si algún precio cambió, queda registrado en el repo.
      - name: Commitear precios si cambiaron
        run: |
          if [ -n "$(git status --porcelain src/content/cursos)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/cursos
            git commit -m "Precios actualizados según dólar BNA [skip ci]"
            git push
          else
            echo "Sin cambios de precio (dentro del umbral del 3%)."
          fi

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
